version: '3.8'

services:
  backend:
    build: ./Backend
    container_name: caption-lab-backend
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - VISION_MODEL=moondream
      - TEXT_MODEL=llama3.2:3b
    volumes:
      - ./Backend:/app
    restart: unless-stopped
    networks:
      - caption-lab-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: caption-lab-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8001
    restart: unless-stopped
    networks:
      - caption-lab-network

networks:
  caption-lab-network:
    driver: bridge
