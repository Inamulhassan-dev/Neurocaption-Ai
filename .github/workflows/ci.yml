name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-smoke-test:
    name: Backend – Python import smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: pip install -r Backend/requirements.txt

      - name: Smoke-test imports (no Ollama required)
        working-directory: Backend
        env:
          # Prevent the app from trying to reach Ollama on startup
          OLLAMA_HOST: "http://127.0.0.1:11434"
        run: |
          python - <<'EOF'
          # Verify all top-level modules and key symbols import without error.
          # model.py reads env vars at import time but never contacts Ollama until a
          # function that calls requests.post() is invoked – so this is safe in CI.
          import model  # noqa: F401
          import ai_detector  # noqa: F401
          # FastAPI app construction must succeed (load_selected_models is called but
          # tolerates a missing Ollama gracefully).
          import app as _app  # noqa: F401
          assert _app.app is not None, "FastAPI app object not created"
          print("✅ All backend imports OK")
          EOF

  frontend-build:
    name: Frontend – Node.js build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        env:
          CI: false  # treat React warnings as warnings, not errors
          REACT_APP_API_URL: "http://localhost:8001"
        run: npm run build

      - name: Verify build output exists
        run: test -f Frontend/build/index.html && echo "✅ Frontend build OK"
